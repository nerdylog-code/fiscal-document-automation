name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: núcleo é stdlib — nenhuma dependência a instalar
        run: python -c "import sys; print(sys.version)"
      - name: testes
        run: python -m unittest discover -s tests -t . -v
      - name: pipeline reprodutível (2 execuções, mesma planilha)
        run: |
          python -m src.pipeline > /dev/null
          first=$(sha256sum output/conferencia_fiscal.xlsx | cut -d' ' -f1)
          python -m src.pipeline > /dev/null
          second=$(sha256sum output/conferencia_fiscal.xlsx | cut -d' ' -f1)
          echo "run1=$first"
          echo "run2=$second"
          test "$first" = "$second"
      - name: artefatos commitados batem com o pipeline
        run: git diff --exit-code -- fixtures output || (echo "::error::rode 'make all' e commite"; exit 1)
      - name: checagem dos artefatos
        run: python checks/check_artifacts.py
